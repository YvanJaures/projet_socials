<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Mon Application</title>
    <link rel="stylesheet" href="./style/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <form class="login-form">
            <h2>Bienvenue  <sup> <img src="./assets/linkme_lin.png" alt=""></sup></h2>
            <p>Veuillez vous connecter à votre compte</p>

            <div class="input-group">
                <label for="username">Nom d'utilisateur ou Email</label>
                <input type="text" id="username" name="username" placeholder="exemple@mail.com" required>
            </div>

            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox"> Se souvenir de moi
                </label>
                <a href="#" class="forgot-pass">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="login-btn">Se connecter</button>

            <p class="register-link">
                Pas encore de compte ? <a href="./register.html">S'inscrire</a>
            </p>
        </form>
    </div>
</body>
</html>
